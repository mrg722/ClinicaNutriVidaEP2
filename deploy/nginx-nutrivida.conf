server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Copiar aquí el contenido de dist/ después de npm run build.
    root /var/www/clinica-nutrivida;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
